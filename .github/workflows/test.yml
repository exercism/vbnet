name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.100"
      - name: Cache NuGet packages
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.vbproj', '**/packages.lock.json') }}
      - run: ./bin/test.ps1
        shell: pwsh
